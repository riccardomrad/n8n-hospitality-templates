<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E8862A"/>
    </marker>
    <style>
      .card { fill: #FFFFFF; stroke: #DCD5CA; stroke-width: 2; rx: 12; }
      .title { fill: #1B3A5C; font-size: 19px; font-weight: 600; }
      .body { fill: #4A5A6A; font-size: 15px; }
      .tag { fill: #8A7F72; font-size: 13px;
             font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
      .flow { stroke: #E8862A; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .step { fill: #E8862A; font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="470" fill="#F7F3EE"/>

  <!-- row 1: the booking is created -->
  <rect class="card" x="30" y="52" width="300" height="104" rx="12"/>
  <text class="step" x="50" y="80">1</text>
  <text class="title" x="50" y="104">Guest writes on WhatsApp</text>
  <text class="body" x="50" y="130">"Table for 4, Friday at 8pm"</text>

  <path class="flow" d="M 336 104 L 424 104"/>

  <rect class="card" x="430" y="52" width="320" height="104" rx="12"/>
  <text class="step" x="450" y="80">2</text>
  <text class="title" x="450" y="104">n8n checks and saves it</text>
  <text class="tag" x="450" y="130">wf-rest-booking-create</text>

  <path class="flow" d="M 756 104 L 844 104"/>

  <rect class="card" x="850" y="52" width="320" height="104" rx="12"/>
  <text class="step" x="870" y="80">3</text>
  <text class="title" x="870" y="104">Confirmation goes out</text>
  <text class="body" x="870" y="130">Guest gets an answer in seconds</text>

  <!-- database -->
  <path class="flow" d="M 590 162 L 590 206"/>
  <g>
    <ellipse cx="590" cy="228" rx="86" ry="16" fill="#FFFFFF" stroke="#DCD5CA" stroke-width="2"/>
    <path d="M 504 228 L 504 262 A 86 16 0 0 0 676 262 L 676 228" fill="#FFFFFF" stroke="#DCD5CA" stroke-width="2"/>
    <path d="M 504 228 A 86 16 0 0 0 676 228" fill="none" stroke="#DCD5CA" stroke-width="2"/>
    <text class="tag" x="590" y="256" text-anchor="middle">reservations table</text>
  </g>

  <!-- row 2: the day before -->
  <path class="flow" d="M 590 278 L 590 320"/>

  <rect class="card" x="430" y="326" width="320" height="104" rx="12"/>
  <text class="step" x="450" y="354">4</text>
  <text class="title" x="450" y="378">24h before: reminder</text>
  <text class="tag" x="450" y="404">wf-rest-booking-reminder</text>

  <path class="flow" d="M 756 378 L 844 378"/>

  <rect class="card" x="850" y="326" width="320" height="104" rx="12"/>
  <text class="step" x="870" y="354">5</text>
  <text class="title" x="870" y="378">Guest replies, table updated</text>
  <text class="tag" x="870" y="404">wf-rest-booking-inbound</text>

  <!-- error lane -->
  <rect x="30" y="326" width="300" height="104" rx="12" fill="#FDF1E4" stroke="#EBC79B" stroke-width="2"/>
  <text class="step" x="50" y="354">!</text>
  <text class="title" x="50" y="378">If anything breaks</text>
  <text class="tag" x="50" y="404">wf-rest-booking-error-handler</text>
  <text class="body" x="50" y="424" font-size="13">the owner gets told, it never fails silently</text>
</svg>
