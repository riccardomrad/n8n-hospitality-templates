name: Bug report
description: Report a problem with an existing workflow
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please fill in the details below.

  - type: input
    id: workflow_name
    attributes:
      label: Workflow name
      description: Name of the workflow file or workflow
      placeholder: e.g., wf-rest-reservations-whatsapp-confirmation
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What did you expect to happen and what actually happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps to reproduce the bug
      placeholder: |
        1. Import the workflow
        2. Set up credentials...
        3. Execute node X...
    validations:
      required: true

  - type: input
    id: n8n_version
    attributes:
      label: n8n version
      placeholder: e.g., 1.60.0
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional info / screenshots
      description: Paste logs, screenshots, or workflow exports if helpful
    validations:
      required: false
